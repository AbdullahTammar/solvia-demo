<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solvia — Saudi Government Services Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f7;--s:#fff;--s2:#edf2f2;--t:#102126;--m:#65777b;--l:#dce5e5;--b:#0b5960;--g:#d6a35c;--ok:#17825b;--w:#bd7a20;--d:#c95353}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:"IBM Plex Sans Arabic",Inter,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{height:68px;background:var(--s);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20}.brand,.actions,.platform{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:800}.pill,.icon,.btn{border-radius:10px;padding:9px 13px;background:var(--s2);color:var(--t);border:1px solid var(--l)}.btn{font-weight:700}.primary{background:var(--b);color:#fff;border-color:var(--b)}.gold{background:var(--g);color:#17251f;border:0}.layout{display:grid;grid-template-columns:1fr 245px;min-height:calc(100vh - 68px)}.side{background:#092c31;color:#d8e4e5;padding:20px 14px;position:sticky;top:68px;height:calc(100vh - 68px)}.nav{padding:11px 12px;border-radius:10px;margin:3px 0;display:flex;gap:10px;cursor:pointer}.nav:hover,.nav.on{background:#ffffff13;color:#fff}.main{padding:28px;max-width:1450px;width:100%;margin:auto}.hero{background:linear-gradient(135deg,#082f35,#0c6266);border-radius:24px;color:#fff;padding:40px;display:grid;grid-template-columns:1.3fr .7fr;gap:25px}.hero h1{font-size:44px;line-height:1.2;margin:8px 0}.hero p{color:#c9dcde;line-height:1.8}.phone{background:#fff;color:#102126;border-radius:28px;padding:15px;width:280px;margin:auto;box-shadow:0 25px 60px #0005}.mini,.card{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:18px}.mini{background:#eef5f4;margin:8px 0}.head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 15px}.head h1,.head h2{margin:0}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.muted{color:var(--m)}.plat{width:48px;height:48px;border-radius:14px;background:var(--s2);display:grid;place-items:center;color:var(--b);font-weight:800}.tag,.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#e7f5ef;color:var(--ok)}.status.warn{background:#fff3df;color:var(--w)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.num{font-size:29px;font-weight:800}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid var(--l);text-align:right;white-space:nowrap}.table th{font-size:12px;color:var(--m)}.chart{height:170px;display:flex;align-items:end;gap:8px}.chart i{flex:1;background:var(--b);border-radius:6px 6px 2px 2px}.modal{position:fixed;inset:0;background:#06191dcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--s);border-radius:20px;padding:24px}.form{display:grid;gap:12px}.form input,.form select,.form textarea{padding:11px;border:1px solid var(--l);border-radius:10px;background:var(--s);color:var(--t)}.toast{position:fixed;bottom:25px;left:25px;background:#092c31;color:#fff;padding:12px 16px;border-radius:11px;display:none;z-index:80}.toast.show{display:block}.mobile{display:none}body.dark{--bg:#07191d;--s:#0d252a;--s2:#153137;--t:#edf3f4;--m:#9cafb3;--l:#284247}@media(max-width:900px){.hero{grid-template-columns:1fr}.phone{display:none}.g4,.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.layout{display:block}.side{display:none}.main{padding:16px 13px 78px}.hero{padding:26px 21px}.hero h1{font-size:32px}.g2,.g3,.g4,.stats{grid-template-columns:1fr}.top{padding:0 13px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid var(--l);justify-content:space-around;padding:9px;z-index:30}.mobile button{background:none;color:var(--m)}}
</style></head><body><div id="root"></div><div class="modal" id="modal"><div class="modalbox" id="mb"></div></div><div class="toast" id="toast"></div>
<script>
const platforms=[["قوى","Qiwa","Q"],["مدد","Mudad","M"],["التأمينات الاجتماعية","GOSI","G"],["الموارد البشرية","HRSD","H"],["مساند","Musaned","م"],["بنك التنمية","SDB","S"],["ناجز","Najiz","ن"]];
const services=[["خدمات قوى","إدارة خدمات المنشآت والموظفين","149"],["خدمات مدد","حماية الأجور والعمليات المرتبطة","99"],["التأمينات الاجتماعية","اشتراكات وتحديث ومتابعة","129"],["خدمات ناجز","الخدمات العدلية والإجراءات","199"],["خدمات مساند","إجراءات العمالة المنزلية","149"],["استشارات عمالية","موعد مع مختص ومتابعة","249"],["إدارة HR عن بعد","إدارة موارد بشرية للمنشآت","499"],["بنك التنمية","المساعدة في خدمات التمويل","حسب الطلب"]];
let role="customer",page="home";
const menus={customer:[["home","الرئيسية"],["services","الخدمات"],["requests","طلباتي"],["invoices","الفواتير"],["appointments","المواعيد"]],employee:[["dashboard","لوحة العمل"],["tickets","التذاكر"],["customers","العملاء"],["platforms","المنصات"],["appointments","المواعيد"]],manager:[["dashboard","لوحة المدير"],["tickets","التذاكر"],["pricing","الأسعار"],["finance","المالية"],["reports","التقارير"],["permissions","الصلاحيات"]]};
function shell(c){let m=menus[role];return `<header class="top"><div class="brand"><div class="logo">S</div><b>Solvia</b></div><div class="actions"><button class="pill" onclick="switchRole()">${role==="customer"?"عميل":role==="employee"?"موظف":"مدير"} ▾</button><button class="icon" onclick="lang()">ع/EN</button><button class="icon" onclick="dark()">◐</button></div></header><div class="layout"><main class="main">${c}</main><aside class="side"><small>مساحة ${role==="customer"?"العميل":"العمل"}</small>${m.map(x=>`<div class="nav ${page===x[0]?"on":""}" onclick="go('${x[0]}')">◈ <span>${x[1]}</span></div>`).join("")}<div class="nav" onclick="toast('مركز الدعم مفتوح')">◉ الدعم والمساعدة</div></aside></div><nav class="mobile">${m.slice(0,4).map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</nav>`}
function home(){return `<section class="hero"><div><span style="color:#e0b77c;font-weight:700">خدمات حكومية. أبسط. أسرع.</span><h1>أنجز خدماتك الحكومية<br>من مكان واحد</h1><p>Solvia تربط الأفراد والمنشآت بفريق مختص لإنجاز ومتابعة الخدمات عبر المنصات الحكومية السعودية، مع رحلة واضحة ودفع إلكتروني وتحديثات مستمرة.</p><div class="actions"><button class="btn gold" onclick="request()">ابدأ طلب خدمة</button><button class="btn" style="background:#ffffff15;color:#fff;border-color:#ffffff25" onclick="meeting()">حلول الشركات</button></div></div><div class="phone"><b>مرحباً عبدالله</b><p class="muted">طلباتك النشطة</p><div class="mini"><span class="tag">قيد التنفيذ</span><h3>#REQ-10429 · قوى</h3><small>المختص يعمل على الطلب</small></div><div class="mini"><span class="tag">مكتمل</span><h3>#REQ-10381 · ناجز</h3></div></div></section><div class="head"><div><h2>المنصات التي نخدمك فيها</h2><span class="muted">وصول منظم لخدمات المنصات الحكومية الرئيسية</span></div></div><div class="grid g4">${platforms.map(p=>`<div class="card platform"><div class="plat">${p[2]}</div><div><b>${p[0]}</b><div class="muted">${p[1]}</div></div></div>`).join("")}</div><div class="head"><div><h2>خدمات مختارة</h2><span class="muted">للأفراد والمنشآت</span></div><button class="pill" onclick="go('services')">عرض الكل</button></div><div class="grid g4">${services.slice(0,4).map(s=>svc(s)).join("")}</div><div class="head"><h2>حلول الشركات</h2></div><div class="grid g3"><div class="card"><h3>إدارة HR عن بعد</h3><p class="muted">فريق مختص يدير العمليات الحكومية والموارد البشرية لمنشأتك.</p></div><div class="card"><h3>اشتراكات مرنة</h3><p class="muted">خطط شهرية بحسب حجم المنشأة وحجم الطلبات.</p></div><div class="card"><h3>تقارير واضحة</h3><p class="muted">تقارير تشغيلية ومالية يومية وأسبوعية وشهرية.</p></div></div>`}
function svc(s){return `<div class="card"><span class="tag">خدمة</span><h3>${s[0]}</h3><p class="muted">${s[1]}</p><b>${s[2]==="حسب الطلب"?s[2]:"من "+s[2]+" ر.س"}</b><br><br><button class="btn primary" onclick="request('${s[0]}')">طلب الخدمة</button></div>`}
function customer(){if(page==="home")return home();if(page==="services")return `<div class="head"><div><h1>الخدمات</h1><p class="muted">اختر الخدمة المناسبة وابدأ الطلب.</p></div></div><div class="grid g3">${services.map(s=>svc(s)).join("")}</div>`;if(page==="requests")return tickets(false);if(page==="invoices")return tablePage("الفواتير",["رقم الفاتورة","الخدمة","المبلغ","الحالة"],[["INV-2091","خدمة قوى","149 ر.س","مدفوعة"],["INV-2077","ناجز","199 ر.س","مدفوعة"],["INV-2041","استشارة","249 ر.س","مدفوعة"]]);if(page==="appointments")return appointments()}
function dashboard(){return `<div class="head"><div><h1>${role==="manager"?"لوحة المدير":"صباح الخير، أحمد"}</h1><p class="muted">نظرة مباشرة على عمليات اليوم.</p></div><button class="btn primary" onclick="toast('تم تحديث البيانات')">تحديث</button></div><div class="stats"><div class="card"><span class="muted">تذاكر نشطة</span><div class="num">48</div></div><div class="card"><span class="muted">جديدة اليوم</span><div class="num">17</div></div><div class="card"><span class="muted">ضمن SLA</span><div class="num">94%</div></div><div class="card"><span class="muted">${role==="manager"?"إيرادات الشهر":"مكتملة اليوم"}</span><div class="num">${role==="manager"?"184K":"23"}</div></div></div><div class="grid g2" style="margin-top:15px"><div class="card"><h3>حركة الطلبات</h3><div class="chart">${[35,62,48,75,58,82,69,91,76,88].map(h=>`<i style="height:${h}%"></i>`).join("")}</div></div><div class="card"><h3>أولوية العمل</h3><p><span class="status warn">عالية</span> #REQ-10429 · قوى</p><p><span class="status">عادية</span> #REQ-10426 · ناجز</p><p><span class="status">عادية</span> #REQ-10422 · مدد</p></div></div>`}
function tickets(customerMode=true){return tablePage(customerMode?"طلباتي":"إدارة التذاكر",["التذكرة","الخدمة","العميل","الحالة","SLA"],[["REQ-10429","قوى","عبدالله تمّار","قيد التنفيذ","6h"],["REQ-10426","ناجز","ريم القحطاني","جديد","9h"],["REQ-10422","مدد","ركن الأعمال","بانتظار العميل","14h"],["REQ-10418","GOSI","مسار التجارية","مكتمل","—"]],true)}
function tablePage(title,heads,rows,click=false){return `<div class="head"><div><h1>${title}</h1><p class="muted">بيانات تجريبية لعرض تجربة النظام.</p></div><div class="actions"><button class="pill">بحث</button><button class="pill">تصفية</button></div></div><div class="card tablewrap"><table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr ${click?'onclick="ticket()"" style="cursor:pointer"':''}>${r.map((v,i)=>`<td>${i===3?'<span class="status">'+v+'</span>':v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function appointments(){return `<div class="head"><div><h1>المواعيد والاستشارات</h1><p class="muted">احجز مكالمة افتراضية مع مختص.</p></div><button class="btn primary" onclick="meeting()">حجز موعد</button></div><div class="grid g2"><div class="card"><span class="tag">قادم</span><h3>استشارة عمالية</h3><p>30 سبتمبر · 11:30 صباحاً</p><p class="muted">مكالمة افتراضية · 30 دقيقة</p></div><div class="card"><h3>النماذج المطلوبة</h3><p class="muted">يمكن تنزيل النماذج اللازمة للخدمات قبل الموعد.</p><button class="pill" onclick="toast('تمت محاكاة تنزيل النموذج')">تنزيل نموذج</button></div></div>`}
function internal(){if(page==="dashboard")return dashboard();if(page==="tickets")return tickets(false);if(page==="platforms")return `<div class="head"><div><h1>دليل المنصات الحكومية</h1><p class="muted">وصول سريع للموظفين أثناء تنفيذ الطلبات.</p></div></div><div class="grid g3">${platforms.map(p=>`<div class="card platform"><div class="plat">${p[2]}</div><div><h3 style="margin:0">${p[0]}</h3><span class="muted">${p[1]}</span></div><button class="pill" onclick="toast('فتح تجريبي')">فتح</button></div>`).join("")}</div>`;if(page==="customers")return tablePage("قاعدة العملاء",["العميل","النوع","الجوال","الطلبات"],[["عبدالله تمّار","فرد","05X XXX XXXX","6"],["ركن الأعمال","شركة","011 XXX XXXX","24"],["ريم القحطاني","فرد","05X XXX XXXX","3"]]);if(page==="appointments")return appointments();if(page==="pricing")return `<div class="head"><div><h1>إدارة الأسعار</h1><p class="muted">أسعار الخدمات وخطط الشركات.</p></div><button class="btn primary">+ سعر جديد</button></div><div class="grid g3">${services.slice(0,6).map(s=>svc(s)).join("")}</div>`;if(page==="finance")return tablePage("المالية والمدفوعات",["المعاملة","العميل","المبلغ","الحالة"],[["PAY-9012","ركن الأعمال","499 ر.س","مدفوعة"],["PAY-9011","عبدالله تمّار","149 ر.س","مدفوعة"],["PAY-9008","ريم القحطاني","199 ر.س","مدفوعة"]]);if(page==="reports")return `<div class="head"><div><h1>التقارير</h1><p class="muted">يومي · أسبوعي · شهري</p></div><button class="btn primary" onclick="toast('تم تجهيز التصدير')">تصدير</button></div><div class="grid g2"><div class="card"><h3>الطلبات</h3><div class="chart">${[40,62,51,77,68,88,73,94].map(h=>`<i style="height:${h}%"></i>`).join("")}</div></div><div class="card"><h3>الإيرادات</h3><div class="chart">${[30,45,40,55,61,67,78,91].map(h=>`<i style="height:${h}%"></i>`).join("")}</div></div></div>`;if(page==="permissions")return `<div class="head"><div><h1>الصلاحيات والأدوار</h1><p class="muted">موظف · مشرف · مدير · مالية</p></div></div><div class="grid g2">${["مدير","مشرف","موظف","مالية"].map(x=>`<div class="card"><h3>${x}</h3>${["عرض التذاكر","تعيين الطلبات","إدارة الأسعار","التقارير","المالية"].map((p,i)=>`<p><label><input type="checkbox" ${i<3?"checked":""}> ${p}</label></p>`).join("")}</div>`).join("")}</div>`}
function request(s="خدمة قوى"){modal(`<div class="head" style="margin-top:0"><div><span class="tag">طلب جديد</span><h2>${s}</h2></div><button class="icon" onclick="closeM()">×</button></div><div class="form"><select><option>تذكرة فقط</option><option>تذكرة + متابعة</option></select><input value="عبدالله تمّار"><input value="+966 5X XXX XXXX"><textarea rows="4" placeholder="تفاصيل الطلب"></textarea><div class="card"><b>المستندات</b><p class="muted">ارفع الهوية أو السجل والمستندات المطلوبة.</p><button class="pill" onclick="toast('تم رفع ملف تجريبي')">+ رفع مستند</button></div><div class="card"><b>الدفع الإلكتروني</b><p>Mada · Visa · Mastercard · Apple Pay · STC Pay</p><b>الإجمالي: 149 ر.س</b></div><button class="btn primary" onclick="closeM();toast('تم الدفع وإنشاء REQ-10430')">دفع وإنشاء الطلب</button></div>`)}
function meeting(){modal(`<h2>احجز اجتماعاً مع فريق Solvia</h2><p class="muted">للشركات، إدارة HR عن بعد، والاشتراكات.</p><div class="form"><input placeholder="اسم المنشأة"><input placeholder="اسم المسؤول"><input placeholder="رقم الجوال"><select><option>1–20 موظف</option><option>21–100</option><option>100+</option></select><button class="btn primary" onclick="closeM();toast('تم إرسال طلب الاجتماع')">إرسال</button></div>`)}
function ticket(){modal(`<div class="head" style="margin-top:0"><div><span class="tag">REQ-10429</span><h2>خدمة قوى</h2></div><button class="icon" onclick="closeM()">×</button></div><div class="grid g2"><div class="card"><h3>رحلة الطلب</h3><p>✓ تم الاستلام</p><p>✓ تم الدفع</p><p>✓ تم تعيين الموظف</p><p><b>◉ قيد التنفيذ</b></p><p class="muted">○ الإنجاز</p></div><div class="card"><h3>تفاصيل التشغيل</h3><p>العميل: عبدالله تمّار</p><p>الموظف: أحمد العتيبي</p><p>SLA: 6 ساعات</p><button class="btn primary" onclick="toast('تم تحديث الحالة')">تحديث الحالة</button> <button class="pill" onclick="toast('تم إرسال رسالة للعميل')">WhatsApp / SMS</button></div></div>`)}
function modal(x){document.getElementById("mb").innerHTML=x;document.getElementById("modal").classList.add("show")}function closeM(){document.getElementById("modal").classList.remove("show")}function toast(x){let e=document.getElementById("toast");e.textContent=x;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}function go(p){page=p;render();scrollTo(0,0)}function switchRole(){role=role==="customer"?"employee":role==="employee"?"manager":"customer";page=role==="customer"?"home":"dashboard";render();toast("تم التبديل إلى وضع "+(role==="customer"?"العميل":role==="employee"?"الموظف":"المدير"))}function dark(){document.body.classList.toggle("dark")}function lang(){let ar=document.documentElement.lang==="ar";document.documentElement.lang=ar?"en":"ar";document.documentElement.dir=ar?"ltr":"rtl";toast(ar?"English demo direction enabled":"تم تفعيل العربية")}function render(){document.getElementById("root").innerHTML=shell(role==="customer"?customer():internal())}render();
</script></body></html>
